<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cyanGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad3)"/>
  <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.75"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid3)" opacity="0.6"/>

  <g transform="translate(60, 40)" filter="url(#shadow3)">
    <rect width="1080" height="595" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Window Header -->
    <rect width="1080" height="48" rx="16" fill="#f8fafc"/>
    <path d="M 0 48 L 1080 48" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="28" cy="24" r="6" fill="#f87171"/>
    <circle cx="48" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="68" cy="24" r="6" fill="#34d399"/>
    
    <rect x="360" y="10" width="360" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="440" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="500">auracommerce.store/checkout/optimized</text>
    
    <rect x="950" y="12" width="105" height="24" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
    <circle cx="964" cy="24" r="3" fill="#0284c7"/>
    <text x="974" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0369a1">0.7S LCP SPEED</text>

    <!-- Content -->
    <g transform="translate(40, 70)">
      <!-- Left: Storefront & Cart Machine -->
      <g transform="translate(0, 0)">
        <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a">AuraCommerce Headless Platform</text>
        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Edge-rendered Next.js catalog with instantaneous dynamic inventory lock</text>
        
        <!-- Product Grid Preview -->
        <g transform="translate(0, 65)">
          <!-- Product Card 1 -->
          <g transform="translate(0, 0)">
            <rect width="180" height="220" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
            <rect x="15" y="15" width="150" height="110" rx="6" fill="#e2e8f0"/>
            <text x="15" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Aura Pro Series 4</text>
            <text x="15" y="165" font-family="monospace" font-size="13" font-weight="600" fill="#0284c7">$349.00</text>
            <rect x="15" y="180" width="150" height="26" rx="4" fill="url(#cyanGrad3)"/>
            <text x="50" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Add To Cart</text>
          </g>

          <!-- Product Card 2 -->
          <g transform="translate(200, 0)">
            <rect width="180" height="220" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
            <rect x="15" y="15" width="150" height="110" rx="6" fill="#e2e8f0"/>
            <text x="15" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Aura Core Dock</text>
            <text x="15" y="165" font-family="monospace" font-size="13" font-weight="600" fill="#0284c7">$189.00</text>
            <rect x="15" y="180" width="150" height="26" rx="4" fill="#0f172a"/>
            <text x="50" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Add To Cart</text>
          </g>

          <!-- Product Card 3 -->
          <g transform="translate(400, 0)">
            <rect width="180" height="220" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
            <rect x="15" y="15" width="150" height="110" rx="6" fill="#e2e8f0"/>
            <text x="15" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Aura Sensor Link</text>
            <text x="15" y="165" font-family="monospace" font-size="13" font-weight="600" fill="#0284c7">$89.00</text>
            <rect x="15" y="180" width="150" height="26" rx="4" fill="#0f172a"/>
            <text x="50" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Add To Cart</text>
          </g>
        </g>

        <!-- Metrics Row below -->
        <g transform="translate(0, 310)">
          <rect width="580" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155">OPTIMIZATION BENCHMARKS</text>
          <g transform="translate(20, 50)">
            <text x="0" y="20" font-family="monospace" font-size="28" font-weight="700" fill="#0284c7">+310%</text>
            <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Mobile Conversion Surge</text>
            
            <text x="190" y="20" font-family="monospace" font-size="28" font-weight="700" fill="#16a34a">0.7s</text>
            <text x="190" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Largest Contentful Paint</text>

            <text x="360" y="20" font-family="monospace" font-size="28" font-weight="700" fill="#0f172a">100/100</text>
            <text x="360" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Google Lighthouse Score</text>
          </g>
        </g>
      </g>

      <!-- Right: Sub-second Checkout Flow -->
      <g transform="translate(620, 0)">
        <rect width="380" height="450" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Zero-Friction Checkout</text>
        <text x="24" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Prisma Row Lock Active (5 min inventory hold)</text>
        
        <g transform="translate(24, 75)">
          <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569">SHIPPING DETAILS</text>
          <rect y="24" width="332" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#0f172a">sarah.jenkins@enterprise.com</text>

          <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569">PAYMENT METHOD</text>
          <rect y="95" width="332" height="48" rx="6" fill="#ecfeff" stroke="#38bdf8" stroke-width="1.5"/>
          <circle cx="24" cy="119" r="6" fill="#0284c7"/>
          <text x="40" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Apple Pay / Instant Checkout</text>

          <line x1="0" y1="165" x2="332" y2="165" stroke="#f1f5f9" stroke-width="1"/>

          <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Subtotal</text>
          <text x="280" y="190" font-family="monospace" font-size="12" fill="#0f172a" font-weight="600">$538.00</text>
          
          <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Express Shipping</text>
          <text x="300" y="215" font-family="monospace" font-size="12" fill="#16a34a" font-weight="600">FREE</text>

          <text x="0" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Total</text>
          <text x="270" y="245" font-family="monospace" font-size="15" fill="#0284c7" font-weight="700">$538.00</text>

          <rect y="270" width="332" height="44" rx="8" fill="url(#cyanGrad3)"/>
          <text x="110" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Confirm & Pay</text>
        </g>
      </g>
    </g>
  </g>
</svg>