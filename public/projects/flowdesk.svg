        <text x="223" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569">3</text>

        <!-- Card 1 -->
        <g transform="translate(10, 38)">
          <rect width="235" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <rect x="12" y="12" width="60" height="18" rx="4" fill="#e0f2fe"/>
          <text x="17" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0284c7">DATABASE</text>
          <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">RLS Isolation Rules</text>
          <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Tenant policy partitioning</text>
          <line x1="12" y1="80" x2="223" y2="80" stroke="#f1f5f9" stroke-width="1"/>
          <circle cx="22" cy="94" r="8" fill="#0284c7"/>
          <text x="18" y="98" font-family="monospace" font-size="9" fill="#ffffff" font-weight="bold">D</text>
          <text x="170" y="97" font-family="monospace" font-size="10" fill="#94a3b8">#DB-104</text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(10, 160)">
          <rect width="235" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <rect x="12" y="12" width="55" height="18" rx="4" fill="#fef3c7"/>
          <text x="17" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#d97706">FRONTEND</text>
          <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Kanban Drag Engine</text>
          <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Optimistic UI response machine</text>
          <line x1="12" y1="80" x2="223" y2="80" stroke="#f1f5f9" stroke-width="1"/>
          <circle cx="22" cy="94" r="8" fill="#0ea5e9"/>
          <text x="18" y="98" font-family="monospace" font-size="9" fill="#ffffff" font-weight="bold">K</text>
          <text x="170" y="97" font-family="monospace" font-size="10" fill="#94a3b8">#FE-882</text>
        </g>
      </g>

      <!-- Column 2: In Code Review -->
      <g transform="translate(280, 70)">
        <rect width="255" height="435" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155">IN CODE REVIEW</text>
        <rect x="215" y="10" width="24" height="20" rx="10" fill="#e2e8f0"/>
        <text x="223" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569">2</text>

        <!-- Card -->
        <g transform="translate(10, 38)">
          <rect width="235" height="120" rx="8" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
          <rect x="12" y="12" width="68" height="18" rx="4" fill="#ecfeff"/>
          <text x="17" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0891b2">WEBSOCKET</text>
          <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Delta Sync Broadcast</text>
          <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">CRDT resolution algorithms</text>
          <rect x="12" y="78" width="120" height="14" rx="3" fill="#f1f5f9"/>
          <text x="16" y="88" font-family="monospace" font-size="9" fill="#0369a1">PR #142 • 4 approvals</text>
          <line x1="12" y1="96" x2="223" y2="96" stroke="#f1f5f9" stroke-width="1"/>
          <circle cx="22" cy="108" r="7" fill="#0284c7"/>
          <text x="19" y="111" font-family="monospace" font-size="8" fill="#ffffff" font-weight="bold">D</text>
          <text x="170" y="109" font-family="monospace" font-size="10" fill="#94a3b8">#WS-301</text>
        </g>
      </g>

      <!-- Column 3: Deployed & Verified -->
      <g transform="translate(550, 70)">
        <rect width="255" height="435" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155">DEPLOYED / VERIFIED</text>
        <rect x="215" y="10" width="24" height="20" rx="10" fill="#dcfce7"/>
        <text x="223" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#16a34a">6</text>

        <!-- Card -->
        <g transform="translate(10, 38)">
          <rect width="235" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <rect x="12" y="12" width="75" height="18" rx="4" fill="#dcfce7"/>
          <text x="17" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#15803d">PRODUCTION</text>
          <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Multi-Region Edge Caching</text>
          <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Sub-20ms dynamic ISR delivery</text>
          <line x1="12" y1="80" x2="223" y2="80" stroke="#f1f5f9" stroke-width="1"/>
          <circle cx="22" cy="94" r="8" fill="#0ea5e9"/>
          <text x="18" y="98" font-family="monospace" font-size="9" fill="#ffffff" font-weight="bold">K</text>
          <text x="160" y="97" font-family="monospace" font-size="10" fill="#16a34a">✓ Pass Test</text>
        </g>
      </g>
    </g>
  </g>
</svg>