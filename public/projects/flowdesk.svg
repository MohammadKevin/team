<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.75"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.6"/>

  <!-- Main Window Frame -->
  <g transform="translate(60, 40)" filter="url(#cardShadow)">
    <rect width="1080" height="595" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Window Header -->
    <rect width="1080" height="48" rx="16" fill="#f8fafc"/>
    <path d="M 0 48 L 1080 48" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#f87171"/>
    <circle cx="48" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="68" cy="24" r="6" fill="#34d399"/>
    
    <!-- Address Bar -->
    <rect x="360" y="10" width="360" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="440" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="500">app.flowdesk.io/workspace/sprint-34</text>
    
    <!-- Status Badge -->
    <rect x="960" y="12" width="96" height="24" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
    <circle cx="974" cy="24" r="3" fill="#06b6d4"/>
    <text x="984" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0891b2">SYNC ACTIVE</text>

    <!-- App Sidebar -->
    <g transform="translate(0, 48)">
      <rect width="220" height="547" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Workspace Brand -->
      <g transform="translate(20, 24)">
        <rect width="28" height="28" rx="8" fill="url(#cyanGrad)"/>
        <text x="9" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">F</text>
        <text x="38" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">FlowDesk</text>
        <rect x="120" y="5" width="48" height="18" rx="4" fill="#f1f5f9"/>
        <text x="126" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b">PRO</text>
      </g>

      <!-- Nav Items -->
      <g transform="translate(16, 75)">
        <rect width="188" height="34" rx="6" fill="#e0f2fe"/>
        <circle cx="16" cy="17" r="4" fill="#0284c7"/>
        <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0369a1">Active Sprints</text>
        
        <g transform="translate(0, 42)">
          <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">Backlog Items</text>
        </g>
        <g transform="translate(0, 78)">
          <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">API Telemetry</text>
        </g>
        <g transform="translate(0, 114)">
          <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">Team Mesh</text>
        </g>
      </g>
      
      <!-- Metrics Card in Sidebar -->
      <g transform="translate(16, 380)">
        <rect width="188" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">CLUSTER METRICS</text>
        <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a">99.99%</text>
        <text x="14" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#10b981">● 14ms WebSocket latency</text>
        <rect x="14" y="86" width="160" height="6" rx="3" fill="#f1f5f9"/>
        <rect x="14" y="86" width="142" height="6" rx="3" fill="#06b6d4"/>
        <text x="14" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Postgres RLS Active</text>
      </g>
    </g>

    <!-- Main Workspace Content -->
    <g transform="translate(240, 68)">
      <!-- Top Title Bar -->
      <text x="10" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Sprint 34: High-Scale Engine Delivery</text>
      <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Multi-tenant partition • 42 tasks in progress • 8 active contributors</text>
      
      <!-- Action Buttons -->
      <g transform="translate(640, 8)">
        <rect width="90" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
        <text x="18" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155">Filters</text>
        <rect x="102" y="0" width="80" height="32" rx="6" fill="url(#cyanGrad)"/>
        <text x="114" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">+ Task</text>
