        <rect width="255" height="435" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155">IN ARCHITECTURE</text>
