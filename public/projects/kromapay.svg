              <circle cx="16" cy="21" r="4" fill="#16a34a"/>
              <text x="28" y="25" font-family="monospace" font-size="11" fill="#0f172a" font-weight="600">tx_984f_021</text>
              <text x="145" y="25" font-family="monospace" font-size="11" fill="#64748b">+$8,990.00</text>
