              <rect width="374" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
              <circle cx="16" cy="21" r="4" fill="#16a34a"/>
              <text x="28" y="25" font-family="monospace" font-size="11" fill="#0f172a" font-weight="600">tx_984f_022</text>
              <text x="145" y="25" font-family="monospace" font-size="11" fill="#64748b">+$550.00</text>
