<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad2)"/>
  
  <!-- Subtle Grid Lines -->
  <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.75"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid2)" opacity="0.6"/>

  <!-- Main Window Frame -->
  <g transform="translate(60, 40)" filter="url(#shadow2)">
    <rect width="1080" height="595" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Window Header -->
    <rect width="1080" height="48" rx="16" fill="#f8fafc"/>
    <path d="M 0 48 L 1080 48" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="28" cy="24" r="6" fill="#f87171"/>
    <circle cx="48" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="68" cy="24" r="6" fill="#34d399"/>
    
    <rect x="360" y="10" width="360" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
