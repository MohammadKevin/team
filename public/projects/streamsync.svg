<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cyanGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad4)"/>
  <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.75"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid4)" opacity="0.6"/>

  <g transform="translate(60, 40)" filter="url(#shadow4)">
    <rect width="1080" height="595" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Window Header -->
    <rect width="1080" height="48" rx="16" fill="#f8fafc"/>
    <path d="M 0 48 L 1080 48" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="28" cy="24" r="6" fill="#f87171"/>
    <circle cx="48" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="68" cy="24" r="6" fill="#34d399"/>
    
    <rect x="360" y="10" width="360" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="430" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="500">canvas.streamsync.app/mesh/live-board</text>
    
    <rect x="940" y="12" width="115" height="24" rx="12" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
    <circle cx="954" cy="24" r="3" fill="#0284c7"/>
    <text x="964" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0369a1">60 FPS CRDT SYNC</text>

    <!-- Canvas Workspace -->
    <g transform="translate(40, 70)">
      <!-- Top floating canvas toolbars -->
      <g transform="translate(0, 0)">
        <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a">StreamSync Multiplayer Engine</text>
        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Decentralized CRDT state synchronizer with sub-15ms delta broadcast</text>
        
        <!-- Toolbar Pill -->
        <g transform="translate(700, 10)">
          <rect width="300" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <!-- Tool icons / buttons -->
          <rect x="10" y="6" width="28" height="28" rx="4" fill="#e0f2fe"/>
          <text x="18" y="24" font-family="monospace" font-size="12" fill="#0284c7" font-weight="bold">↖</text>
          <rect x="45" y="6" width="28" height="28" rx="4" fill="#f8fafc"/>
          <text x="53" y="24" font-family="monospace" font-size="12" fill="#64748b">□</text>
          <rect x="80" y="6" width="28" height="28" rx="4" fill="#f8fafc"/>
          <text x="88" y="24" font-family="monospace" font-size="12" fill="#64748b">○</text>
          <rect x="115" y="6" width="28" height="28" rx="4" fill="#f8fafc"/>
          <text x="123" y="24" font-family="monospace" font-size="12" fill="#64748b">T</text>
          
          <line x1="155" y1="8" x2="155" y2="32" stroke="#e2e8f0" stroke-width="1"/>

          <!-- Active Avatars -->
          <circle cx="180" cy="20" r="12" fill="#0284c7"/>
          <text x="176" y="24" font-family="monospace" font-size="10" fill="#ffffff" font-weight="bold">K</text>
          <circle cx="205" cy="20" r="12" fill="#06b6d4"/>
          <text x="201" y="24" font-family="monospace" font-size="10" fill="#ffffff" font-weight="bold">D</text>
          <circle cx="230" cy="20" r="12" fill="#10b981"/>
          <text x="226" y="24" font-family="monospace" font-size="10" fill="#ffffff" font-weight="bold">E</text>
          <rect x="250" y="10" width="38" height="20" rx="10" fill="#f1f5f9"/>
          <text x="256" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#475569">+18</text>
        </g>
      </g>

      <!-- Interactive Canvas Area -->
      <g transform="translate(0, 70)">
        <rect width="1000" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        
        <!-- Architecture diagram nodes on canvas -->
        <!-- Node 1: Ingestion API Gateway -->
        <g transform="translate(60, 60)">
          <rect width="220" height="110" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
          <rect x="12" y="12" width="75" height="20" rx="4" fill="#e0f2fe"/>
          <text x="18" y="26" font-family="monospace" font-size="10" fill="#0284c7" font-weight="700">NODE : WS-01</text>
          <text x="12" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Edge Ingestion</text>
          <text x="12" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">12,000 WebSocket Conns</text>
          <text x="12" y="94" font-family="monospace" font-size="10" fill="#16a34a">● Sub-10ms ping</text>
        </g>

        <!-- Connecting Line 1 -->
        <path d="M 280 115 L 400 115" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4"/>
        <polygon points="400,115 390,110 390,120" fill="#0284c7"/>

        <!-- Node 2: CRDT State Merger -->
        <g transform="translate(400, 45)">
          <rect width="240" height="140" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
          <rect x="12" y="12" width="85" height="20" rx="4" fill="#ecfeff"/>
          <text x="18" y="26" font-family="monospace" font-size="10" fill="#0891b2" font-weight="700">CORE : ENGINE</text>
          <text x="12" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">CRDT Delta Resolver</text>
          <text x="12" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Conflict-free state machine</text>
          <rect x="12" y="90" width="216" height="36" rx="4" fill="#f1f5f9"/>
          <text x="18" y="112" font-family="monospace" font-size="10" fill="#334155">Vector Clock: [142, 98, 310]</text>
        </g>

        <!-- Connecting Line 2 -->
        <path d="M 640 115 L 750 115" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4"/>
        <polygon points="750,115 740,110 740,120" fill="#06b6d4"/>

        <!-- Node 3: Global Broadcast Mesh -->
        <g transform="translate(750, 60)">
          <rect width="200" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
          <rect x="12" y="12" width="70" height="20" rx="4" fill="#f1f5f9"/>
          <text x="18" y="26" font-family="monospace" font-size="10" fill="#475569" font-weight="700">DISTRIBUTED</text>
          <text x="12" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Redis Cluster</text>
          <text x="12" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Pub/Sub Broadcast Mesh</text>
          <text x="12" y="94" font-family="monospace" font-size="10" fill="#0284c7">● 0 edit conflicts</text>
        </g>

        <!-- Live Cursor 1: Kevin -->
        <g transform="translate(320, 220)">
          <polygon points="0,0 0,16 5,13 8,19 11,18 8,11 14,11" fill="#0284c7"/>
          <rect x="12" y="10" width="90" height="20" rx="4" fill="#0284c7"/>
          <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Kevin (Optimistic)</text>
        </g>

        <!-- Live Cursor 2: Danendra -->
        <g transform="translate(680, 240)">
          <polygon points="0,0 0,16 5,13 8,19 11,18 8,11 14,11" fill="#06b6d4"/>
          <rect x="12" y="10" width="105" height="20" rx="4" fill="#06b6d4"/>
          <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Danendra (Cluster)</text>
        </g>
      </g>
    </g>
  </g>
</svg>